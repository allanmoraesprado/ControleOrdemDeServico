services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: osservice-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=OsService2026!Strong#
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  apiservice:
    build:
      context: ..
      dockerfile: ControleOrdemDeServico.ApiService/Dockerfile
    container_name: osservice-api
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=OsServiceDb;User Id=sa;Password=OsService2026!Strong#;TrustServerCertificate=True;Encrypt=False
      - ConnectionStrings__CreateTable=Server=sqlserver;Database=master;User Id=sa;Password=OsService2026!Strong#;TrustServerCertificate=True;Encrypt=False
    ports:
      - "5000:8080"
    volumes:
      - uploads_data:/app/data/uploads

volumes:
  sqlserver_data:
  uploads_data: